<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roma 2025">
<meta name="theme-color" content="#17100A">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Roma 2025 — Notre Guide</title>
<style>
:root {
  --dark: #17100A;
  --red: #8B2500;
  --gold: #C4922A;
  --lgold: #F0C060;
  --white: #FFFFFF;
  --cream: #FBF7F2;
  --muted: #8B6E56;
  --green: #1D9E75;
  --purple: #7F77DD;
  --orange: #BA7517;
  --bg: #F4EFE8;
  --card: #FFFFFF;
  --border: #E8DDD0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--dark); }

/* ── SPLASH ── */
#splash {
  position: fixed; inset: 0; background: var(--dark); z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .6s ease;
}
#splash h1 { font-size: 72px; font-weight: 900; color: var(--gold); letter-spacing: .08em; line-height: 1; }
#splash p { color: var(--lgold); font-size: 14px; letter-spacing: .2em; margin-top: 8px; font-style: italic; }
#splash .sub { color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: .15em; margin-top: 32px; text-transform: uppercase; }
#splash.hide { opacity: 0; pointer-events: none; }

/* ── LAYOUT ── */
#app { height: 100vh; display: flex; flex-direction: column; }

/* ── TOP BAR ── */
.topbar {
  background: var(--dark); color: var(--white);
  padding: 12px 16px 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--gold);
}
.topbar-left { display: flex; flex-direction: column; }
.topbar-title { font-size: 18px; font-weight: 800; letter-spacing: .05em; color: var(--gold); line-height: 1; }
.topbar-sub { font-size: 10px; color: rgba(255,255,255,.45); letter-spacing: .12em; margin-top: 2px; text-transform: uppercase; }
.topbar-date { font-size: 11px; color: var(--lgold); font-weight: 600; text-align: right; line-height: 1.3; }

/* ── DAY TABS ── */
.day-tabs {
  background: var(--dark); flex-shrink: 0;
  display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 8px 12px 10px; gap: 6px;
  border-bottom: 1px solid rgba(196,146,42,.2);
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  border: 1.5px solid rgba(255,255,255,.15); color: rgba(255,255,255,.45);
  background: transparent; cursor: pointer; transition: all .2s;
  white-space: nowrap;
}
.day-tab.active { background: var(--gold); border-color: var(--gold); color: var(--dark); }
.day-tab.booked { border-color: var(--green); color: var(--green); }
.day-tab.booked.active { background: var(--green); color: #fff; border-color: var(--green); }

/* ── CONTENT ── */
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 80px; }

/* ── DAY HEADER ── */
.day-header {
  background: var(--dark); padding: 16px 16px 14px;
  position: relative; overflow: hidden;
}
.day-header::before {
  content: ''; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--red); opacity: .15;
}
.day-num-row { display: flex; align-items: flex-end; gap: 10px; }
.day-num { font-size: 52px; font-weight: 900; color: var(--gold); line-height: 1; }
.day-info { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4px; }
.day-name { font-size: 16px; font-weight: 700; color: var(--white); }
.day-date-txt { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 1px; }
.day-theme { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 8px; font-style: italic; line-height: 1.4; }
.day-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.dbadge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: .06em; text-transform: uppercase; }
.dbadge-red { background: #FCEBEB; color: #8B2500; }
.dbadge-green { background: rgba(29,158,117,.25); color: #7de8c4; border: 1px solid rgba(29,158,117,.3); }
.dbadge-gold { background: rgba(196,146,42,.2); color: var(--lgold); border: 1px solid rgba(196,146,42,.3); }
.dbadge-orange { background: rgba(186,117,23,.2); color: #F0C060; border: 1px solid rgba(186,117,23,.3); }

/* ── SECTION ── */
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .18em;
  color: var(--muted); text-transform: uppercase;
  padding: 12px 16px 6px; background: var(--bg);
}

/* ── EVENTS ── */
.events { padding: 0 12px; display: flex; flex-direction: column; gap: 6px; }
.event { display: flex; gap: 10px; }
.event-line { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
.edot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; margin-top: 12px; border: 2px solid var(--bg); }
.econn { width: 2px; flex: 1; min-height: 6px; margin: 2px 0; opacity: .3; }
.event:last-child .econn { display: none; }
.ecard {
  flex: 1; background: var(--card); border-radius: 10px;
  padding: 10px 12px 12px; border-left: 3px solid transparent;
  box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 0;
}
.ecard.reserved { background: #F0FDF8; }
.etime { font-size: 10px; font-weight: 700; letter-spacing: .1em; }
.ename { font-size: 14px; font-weight: 700; color: var(--dark); margin: 3px 0 4px; line-height: 1.25; }
.edesc { font-size: 12px; color: #555; line-height: 1.55; }
.epills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.pill { font-size: 10px; padding: 2px 7px; border-radius: 20px; border: .5px solid; font-weight: 600; }
.p-gr { background: #E1F5EE; border-color: #5DCAA5; color: #085041; }
.p-pu { background: #EEEDFE; border-color: #AFA9EC; color: #26215C; }
.p-or { background: #FAEEDA; border-color: #EF9F27; color: #412402; }
.p-gy { background: #f5f5f5; border-color: #ddd; color: #666; }
.p-rd { background: #FCEBEB; border-color: #F09595; color: #501313; }
.p-go { background: #FDF6E3; border-color: #C4922A; color: #7A5A10; }

/* ── MAPS BUTTON ── */
.maps-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--dark); color: var(--lgold);
  border: none; border-radius: 6px; padding: 7px 11px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  margin-top: 8px; cursor: pointer; text-decoration: none;
  width: fit-content;
}
.maps-btn svg { width: 13px; height: 13px; fill: var(--lgold); flex-shrink: 0; }

/* ── INFO BOX ── */
.infobox {
  margin: 10px 12px 0; border-radius: 8px;
  padding: 10px 12px; border-left: 3px solid;
}
.infobox-green { background: #E1F5EE; border-color: var(--green); }
.infobox-orange { background: #FAEEDA; border-color: var(--orange); }
.infobox-gold { background: #FDF6E3; border-color: var(--gold); }
.infobox-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.infobox-green .infobox-label { color: #0F6E56; }
.infobox-orange .infobox-label { color: #633806; }
.infobox-gold .infobox-label { color: #7A5A10; }
.infobox-text { font-size: 12px; line-height: 1.55; }
.infobox-green .infobox-text { color: #085041; }
.infobox-orange .infobox-text { color: #633806; }
.infobox-gold .infobox-text { color: #5A4008; }

/* ── BUDGET ── */
.budget-card {
  margin: 10px 12px 0; background: var(--card);
  border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.budget-title { font-size: 10px; font-weight: 700; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.budget-row { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }
.budget-row b { color: var(--dark); font-weight: 600; }
.budget-total { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--dark); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--dark); border-top: 2px solid rgba(196,146,42,.3);
  display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; cursor: pointer; padding: 4px 0;
  color: rgba(255,255,255,.35); font-size: 9px; letter-spacing: .06em;
  text-transform: uppercase; transition: color .2s;
}
.nav-btn.active { color: var(--gold); }
.nav-btn svg { width: 20px; height: 20px; fill: currentColor; }

/* ── EMERGENCY PAGE ── */
.emergency { padding: 16px; }
.emer-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.emer-title { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
.emer-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
.emer-row:last-child { border-bottom: none; }
.emer-label { font-size: 12px; color: #555; }
.emer-val { font-size: 13px; font-weight: 700; color: var(--dark); }
.call-btn { display: block; background: #1D9E75; color: #fff; text-decoration: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 700; text-align: center; margin-top: 6px; }
.call-btn.red { background: #C62828; }

/* ── INFOS PAGE ── */
.infos { padding: 16px; }
.info-section { margin-bottom: 16px; }
.info-section h3 { font-size: 12px; font-weight: 700; letter-spacing: .15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.info-item { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border-left: 3px solid var(--gold); }
.info-item h4 { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
.info-item p { font-size: 12px; color: #555; line-height: 1.5; }
</style>
</head>

function buildDay(d) {
  const day = days[d];
  let html = '';

  // Header
  html += `<div class="day-header">
    <div class="day-num-row">
      <div class="day-num">J${d}</div>
      <div class="day-info">
        <div class="day-name">${day.name}</div>
        <div class="day-date-txt">${day.date}</div>
      </div>
    </div>
    <div class="day-theme">${day.theme}</div>
    <div class="day-badges">${day.badges.map(b=>`<span class="dbadge ${b.c}">${b.t}</span>`).join('')}</div>
  </div>`;

  // Sections
  day.sections.forEach(sec => {
    html += `<div class="section-label">${sec.label}</div>`;
    html += `<div class="events">`;
    sec.events.forEach((ev, i) => {
      const col = TYPE_COLORS[ev.type] || TYPE_COLORS.visit;
      const isLast = i === sec.events.length - 1;
      html += `<div class="event">
        <div class="event-line">
          <div class="edot" style="background:${col.dot};box-shadow:0 0 0 2px ${col.dot}"></div>
          ${!isLast ? `<div class="econn" style="background:${col.conn}"></div>` : ''}
        </div>
        <div class="ecard${ev.type==='booked'?' reserved':''}${ev.type==='urgent'?' style="border-left-color:#C62828;background:#FFF5F5"':''}" style="border-left-color:${col.border}">
          <div class="etime" style="color:${col.dot}">${ev.time}</div>
          <div class="ename">${ev.name}</div>
          <div class="edesc">${ev.desc}</div>
          ${ev.pills.length ? `<div class="epills">${ev.pills.map(p=>`<span class="pill ${p.c}">${p.t}</span>`).join('')}</div>` : ''}
          ${ev.lat ? `<a class="maps-btn" href="https://maps.google.com/maps?q=${ev.lat},${ev.lng}" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Ouvrir dans Maps
          </a>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  // Tips
  if (day.tips) {
    day.tips.forEach(tip => {
      const cls = tip.type === 'orange' ? 'infobox-orange' : tip.type === 'gold' ? 'infobox-gold' : 'infobox-green';
      html += `<div class="infobox ${cls}">
        <div class="infobox-label">${tip.label}</div>
        <div class="infobox-text">${tip.text}</div>
      </div>`;
    });
  }

  // Budget
  html += `<div class="budget-card" style="margin-top:10px">
    <div class="budget-title">BUDGET ESTIMÉ (2 PERSONNES)</div>
    ${day.budget.map(([l,v])=>`<div class="budget-row"><span>${l}</span><b>${v}</b></div>`).join('')}
    <div class="budget-total"><span>Total estimé</span><span>${day.total}</span></div>
  </div>`;

  html += '<div style="height:16px"></div>';
  return html;
}

function showDay(d) {
  currentDay = d;
  // Update tabs
  document.querySelectorAll('.day-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === d);
  });
  // Scroll tab into view
  const activeTab = document.querySelectorAll('.day-tab')[d];
  if (activeTab) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  // Render content
  const content = document.getElementById('content');
  if (currentTab === 'map') {
    content.innerHTML = buildMap();
    if (typeof L !== 'undefined') setTimeout(initLeafMap, 50);
  } else if (d === 0) {
    content.innerHTML = buildOverview();
  } else {
    content.innerHTML = buildDay(d);
  }
  content.scrollTop = 0;
}

function getMapPoints(dayIdx) {
  const TYPE_COLORS = { visit:'#7F77DD', food:'#1D9E75', transport:'#BA7517', free:'#888880', key:'#C4922A', booked:'#1D9E75', special:'#C4922A', urgent:'#C62828' };

  if (dayIdx === 0) {
    points = [
      { name:"🏠 Logement — Via Caracciolo 6", desc:"Votre base pour 7 jours — Quartier Prati", lat:41.908, lng:12.463, color:'#C4922A', num:'🏠', time:'' },
      { name:"Colisée", desc:"J3 — Dimanche 10 mai · Réservé 9h", lat:41.8902, lng:12.4922, color:'#7F77DD', num:'J3', time:'' },
      { name:"Forum Romain", desc:"J3 — Inclus dans le billet Colisée", lat:41.8921, lng:12.4864, color:'#7F77DD', num:'J3', time:'' },
      { name:"Vatican", desc:"J6 — Mercredi 13 mai · Réservé 13h30", lat:41.9065, lng:12.4536, color:'#1D9E75', num:'J6', time:'' },
      { name:"Castel Sant'Angelo", desc:"J6 — 5 min du logement", lat:41.9031, lng:12.4663, color:'#1D9E75', num:'J6', time:'' },
      { name:"Villa Adriana — Tivoli", desc:"J4 — Lundi 11 mai · UNESCO", lat:41.9461, lng:12.7729, color:'#0D9E9E', num:'J4', time:'' },
      { name:"Villa d'Este — Tivoli", desc:"J4 — Lundi 11 mai · UNESCO", lat:41.9633, lng:12.7958, color:'#0D9E9E', num:'J4', time:'' },
      { name:"Panthéon", desc:"J1 — Vendredi 8 mai · Réservé 15h30", lat:41.8986, lng:12.4769, color:'#7F77DD', num:'J1', time:'' },
      { name:"Fontaine de Trevi", desc:"J1 & J2 — Monument emblématique", lat:41.9009, lng:12.4833, color:'#888880', num:'★', time:'' },
    ];
  } else if (day && day.sections) {
    let n = 1;
    day.sections.forEach(sec => {
      sec.events.forEach(ev => {
        if (ev.lat && ev.lng) {
          points.push({
            name: ev.name.replace(/✅ |⭐ |⚠ /g,''),
            desc: ev.desc.length > 80 ? ev.desc.substring(0,80)+'…' : ev.desc,
            lat: ev.lat, lng: ev.lng,
            color: TYPE_COLORS[ev.type] || '#C4922A',
            num: n++, time: ev.time, type: ev.type
          });
        }
      });
    });
  }
  return points;
}

    return `<div onclick="if(window._leafMap){window._leafMap.setView([${p.lat},${p.lng}],16);window._leafMarkers&&window._leafMarkers[${i}]&&window._leafMarkers[${i}].openPopup()}"
      style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:5px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:3px solid ${p.color};cursor:pointer">
      <div style="width:28px;height:28px;border-radius:50%;background:${p.color};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 4px ${p.color}88">${p.num}</div>
      <div style="flex:1;min-width:0">
        ${p.time ? `<div style="font-size:10px;color:${p.color};font-weight:700;letter-spacing:.08em;margin-bottom:1px">${p.time}${label?' · '+label:''}</div>` : ''}
        <div style="font-size:13px;font-weight:600;color:#17100A;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
      </div>
      <a href="https://maps.google.com/maps?q=${p.lat},${p.lng}&z=16" target="_blank"
        onclick="event.stopPropagation()"
        style="font-size:18px;color:#C4922A;text-decoration:none;flex-shrink:0">↗</a>
    </div>`;
  }).join('');

  return `
  <div style="display:flex;flex-direction:column;height:100%;overflow:hidden">

    <!-- Leaflet map container -->
    <div style="position:relative;flex-shrink:0;height:52vh">
      <div id="leafmap" style="width:100%;height:100%;z-index:1"></div>
      <div style="position:absolute;top:8px;left:8px;z-index:10;background:rgba(23,16,10,.88);color:#F0C060;font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;letter-spacing:.06em;pointer-events:none;backdrop-filter:blur(6px)">
        📍 ${dayTitle}
      </div>
    </div>

    <!-- Points list -->
    <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 90px;background:#F4EFE8">
      <div style="font-size:10px;font-weight:700;letter-spacing:.15em;color:#8B6E56;text-transform:uppercase;margin-bottom:8px">
        ${points.length} lieu${points.length>1?'x':''} — Appuyez pour centrer · ↗ pour Maps
      </div>
      ${listHTML}
      <a href="https://maps.google.com/maps?q=41.908,12.463&z=17" target="_blank"
        style="display:flex;align-items:center;justify-content:center;gap:6px;background:#17100A;color:#F0C060;border-radius:8px;padding:11px;font-size:13px;font-weight:700;text-decoration:none;margin-top:6px">
        🏠 Logement Via Caracciolo 6
      </a>
    </div>
  </div>`;
}

function initLeafMap() {
  if (!document.getElementById('leafmap')) return;
  if (typeof L === 'undefined') return;

  const points = getMapPoints(currentDay);
  const centerLat = currentDay === 4 ? 41.955 : 41.898;
  const centerLng = currentDay === 4 ? 12.69 : 12.476;
  const zoom = currentDay === 4 ? 10 : 13;

  // Init map
  const map = L.map('leafmap', { zoomControl:false, attributionControl:false }).setView([centerLat, centerLng], zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  window._leafMap = map;
  window._leafMarkers = [];

  // Home marker
  const homeIcon = L.divIcon({
    html:`<div style="width:32px;height:32px;border-radius:50%;background:#17100A;border:3px solid #C4922A;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.4)">🏠</div>`,
    className:'', iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18]
  });
  L.marker([41.908,12.463], {icon:homeIcon})
    .addTo(map)
    .bindPopup('<b style="color:#17100A">Logement</b><br><span style="font-size:12px;color:#666">Via Francesco Caracciolo 6, Prati</span>');

  // Draw polyline connecting points in order (skip transports for overview)
  if (currentDay > 0 && points.length > 1) {
    const latlngs = points.map(p => [p.lat, p.lng]);
    L.polyline(latlngs, { color:'#C4922A', weight:2, opacity:.5, dashArray:'6,6' }).addTo(map);
  }

  // Place markers
  points.forEach((p, i) => {
    const icon = L.divIcon({
      html:`<div style="width:30px;height:30px;border-radius:50%;background:${p.color};color:#fff;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 8px ${p.color}88;line-height:1">${p.num}</div>`,
      className:'', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-18]
    });
    const marker = L.marker([p.lat, p.lng], {icon})
      .addTo(map)
      .bindPopup(`
        <div style="min-width:160px">
          ${p.time ? `<div style="font-size:10px;color:${p.color};font-weight:700;margin-bottom:2px">${p.time}</div>` : ''}
          <b style="font-size:13px;color:#17100A;line-height:1.3">${p.name}</b>
          <div style="font-size:11px;color:#666;margin-top:3px;line-height:1.4">${p.desc}</div>
          <a href="https://maps.google.com/maps?q=${p.lat},${p.lng}&z=16" target="_blank"
            style="display:inline-block;margin-top:6px;background:${p.color};color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;text-decoration:none">
            Ouvrir Maps ↗
          </a>
        </div>`);
    window._leafMarkers.push(marker);
  });

  // Fit bounds if multiple points
  if (points.length > 1) {
    const allPoints = [[41.908,12.463], ...points.map(p=>[p.lat,p.lng])];
    map.fitBounds(allPoints, { padding:[30,30], maxZoom:15 });
  }
}

function switchTab(tab) {
  currentTab = tab;
  ['prog','infos','map','sos'].forEach(t => {
    const el = document.getElementById(`nav-${t}`);
    if (el) el.classList.toggle('active', t === tab);
  });
  const content = document.getElementById('content');
  const tabs = document.getElementById('day-tabs');
  if (tab === 'prog') {
    tabs.style.display = 'flex';
    showDay(currentDay);
  } else if (tab === 'infos') {
    tabs.style.display = 'none';
    content.innerHTML = buildInfos();
    content.scrollTop = 0;
  } else if (tab === 'map') {
    tabs.style.display = 'flex';
    content.innerHTML = buildMap();
    // Load Leaflet and init map
    if (typeof L === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload = () => initLeafMap();
      document.head.appendChild(s);
    } else {
      setTimeout(initLeafMap, 50);
    }
  } else if (tab === 'sos') {
    tabs.style.display = 'none';
    content.innerHTML = buildSOS();
    content.scrollTop = 0;
  }
}

// Update topbar date
function updateDate() {
  const now = new Date();
  const days_fr = ['Dim.','Lun.','Mar.','Mer.','Jeu.','Ven.','Sam.'];
  const months_fr = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  document.getElementById('topbar-date').innerHTML = `${days_fr[now.getDay()]} ${now.getDate()} ${months_fr[now.getMonth()]}<br>${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateDate();
setInterval(updateDate, 60000);

// Init
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').style.display = 'flex';
    // Auto-select today's day if during trip
    const today = new Date();
    const tripStart = new Date('2025-05-08');
    const dayNum = Math.floor((today - tripStart) / 86400000) + 1;
    const autoDay = (dayNum >= 1 && dayNum <= 7) ? dayNum : 1;
    showDay(autoDay);
    setTimeout(() => document.getElementById('splash').remove(), 700);
  }, 1200);
});
</script>
